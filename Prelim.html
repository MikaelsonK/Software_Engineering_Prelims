<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random User Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <div class="p-4 bg-warning text-white text-center rounded">
      <h2 class="mb-0">Random User Generator</h2>
    </div>


    <form id="controls" class="row g-2 align-items-center mt-4">
      <div class="col-auto">
        <label for="count" class="form-label mb-0">Users:</label>
      </div>
      <div class="col-auto">
        <input id="count" type="number" class="form-control" min="0" max="1000" value="0" style="width:100px;">
      </div>
      <div class="col-auto">
        <select id="nameMode" class="form-select" style="width:140px;">
          <option value="first" selected>First name</option>
          <option value="last">Last name</option>
        </select>
      </div>

      <div class="col-auto">
        <button id="generate" class="btn btn-primary" type="submit" style="background-color: yellow;">Generate</button>
      </div>
    </form>


    <div class="mt-4">
      <table class="table table-striped align-middle mb-0">
        <thead>
          <tr>
            <th>Name</th>
            <th>Gender</th>
            <th>Email</th>
            <th>Country</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </div>
  </div>


  <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">User Info</h5>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-4 text-center">
              <img id="modalPicture" class="img-fluid rounded mb-3" alt="User Picture">
            </div>
            <div class="col-md-8">
              <form id="userForm">
                <div class="mb-2">
                  <label class="form-label">Name</label>
                  <input id="modalName" type="text" class="form-control">
                </div>
                <div class="mb-2">
                  <label class="form-label">Address</label>
                  <input id="modalAddress" type="text" class="form-control">
                </div>
                <div class="mb-2">
                  <label class="form-label">Email</label>
                  <input id="modalEmail" type="email" class="form-control">
                </div>
                <div class="mb-2">
                  <label class="form-label">Phone</label>
                  <input id="modalPhone" type="text" class="form-control">
                </div>
                <div class="mb-2">
                  <label class="form-label">Cell</label>
                  <input id="modalCell" type="text" class="form-control">
                </div>
                <div class="mb-2">
                  <label class="form-label">Date of Birth</label>
                  <input id="modalDob" type="text" class="form-control">
                </div>
                <div class="mb-2">
                  <label class="form-label">Gender</label>
                  <input id="modalGender" type="text" class="form-control">
                </div>
              </form>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="deleteUser" class="btn btn-danger">Delete</button>
          <button id="saveUser" class="btn btn-success">Save Changes</button>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="Prelim.js"></script>
</body>
</html>
