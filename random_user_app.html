<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Random User Generator</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="random_user_app.css" />
</head>
<body>
  <div class="container my-6">
    <h1>Random User Generator</h1>

    <div class="row justify-content-center mb-4">
      <div class="col-md-8">
        <div class="input-group">
          <!-- Input bar -->
          <input
            type="number"
            class="form-control"
            id="userCount"
            placeholder="Enter number of users (1–1000)"
            min="1"
            max="1000"
          />
          <button class="btn btn-primary" id="generateBtn">Generate</button>
        </div>
        <!-- Dropdown to select name display format -->
        <!-- <select
          class="form-select mt-2"
          id="nameType"
          aria-label="Select name display format"
        >
          <option value="first">First Name</option>
          <option value="last">Last Name</option>
        </select> -->
      </div>
    </div>

    <!-- Updated Header Row -->
<!-- Header row with dropdown pill for Name -->
<div class="header-container row text-center align-items-center">
  <div class="header-item col-md-2">
    <select class="name-pill-select" id="nameTypeHeader" aria-label="Select name display format">
      <option value="first">First Name</option>
      <option value="last">Last Name</option>
    </select>
  </div>
  
  <div class="header-item col-md-3">Email</div>
  <div class="header-item col-md-2">Country</div>
</div>


    <div id="userList"></div>

    <!-- Error Handling -->
    <div id="errorAlert" class="alert alert-danger mt-3" style="display:none;"></div>

    <div id="loading" class="text-center mt-3" style="display:none;">
      <div class="spinner-border text-primary" role="status"></div>
      <p>Loading users...</p>
    </div>
  </div>

<!-- User Modal -->
<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <!-- Top bar of the modal -->
      <div class="modal-header">
        <h5 class="modal-title" id="modalUserName">User Details</h5>
        <!-- Close button (X) -->
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <!-- Main body of the modal -->
      <div class="modal-body text-center">

        <!-- Profile Image -->
        <img id="modalUserImage" src="" alt="User Image"
             class="img-fluid rounded-circle mb-3"
             style="width: 150px; height: 150px; object-fit: cover; border: 3px solid #e8e807; padding: 3px;">

        <!-- Pills for user details -->
        <div class="detail-pill"><strong>Full Name:</strong> <span id="modalUserFullName"></span></div>
        <div class="detail-pill"><strong>Address:</strong> <span id="modalUserAddress"></span></div>
        <div class="detail-pill"><strong>Email:</strong> <span id="modalUserEmail"></span></div>
        <div class="detail-pill"><strong>Phone:</strong> <span id="modalUserPhone"></span></div>
        <div class="detail-pill"><strong>Cell:</strong> <span id="modalUserCell"></span></div>
        <div class="detail-pill"><strong>Date of Birth:</strong> <span id="modalUserDob"></span></div>
        <div class="detail-pill"><strong>Gender:</strong> <span id="modalUserGender"></span></div>
      </div>

      <!-- Bottom buttons -->
      <div class="modal-footer">
        <!-- Delete button -->
        <button type="button" class="btn btn-danger" id="modalDeleteBtn">
          <span class="d-none d-md-inline">Delete</span> 
        </button>
        <!-- Edit button -->
        <button type="button" class="btn btn-primary" id="modalEditBtn">
          <span class="d-none d-md-inline">Edit</span> 
        </button>
      </div>

    </div>
  </div>
</div>

  <!-- Edit User Modal -->
  <div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="editUserForm">
            <input type="hidden" id="editUserIndex">
            <div class="mb-3">
              <label for="editFirstName" class="form-label">First Name</label>
              <input type="text" class="form-control" id="editFirstName" required>
            </div>
            <div class="mb-3">
              <label for="editLastName" class="form-label">Last Name</label>
              <input type="text" class="form-control" id="editLastName" required>
            </div>
            <div class="mb-3">
              <label for="editEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="editEmail" required>
            </div>
            <div class="mb-3">
              <label for="editPhone" class="form-label">Phone</label>
              <input type="tel" class="form-control" id="editPhone">
            </div>
            <div class="mb-3">
              <label for="editCell" class="form-label">Cell</label>
              <input type="tel" class="form-control" id="editCell">
            </div>
            <div class="mb-3">
              <label for="editDob" class="form-label">Date of Birth</label>
              <input type="date" class="form-control" id="editDob">
            </div>
            <div class="mb-3">
              <label class="form-label">Gender</label>
              <div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="editGender" id="editGenderMale" value="male">
                  <label class="form-check-label" for="editGenderMale">Male</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="editGender" id="editGenderFemale" value="female">
                  <label class="form-check-label" for="editGenderFemale">Female</label>
                </div>
              </div>
            </div>
            <div class="mb-3">
              <label for="editStreet" class="form-label">Street</label>
              <input type="text" class="form-control" id="editStreet">
            </div>
            <div class="mb-3">
              <label for="editCity" class="form-label">City</label>
              <input type="text" class="form-control" id="editCity">
            </div>
            <div class="mb-3">
              <label for="editState" class="form-label">State</label>
              <input type="text" class="form-control" id="editState">
            </div>
            <div class="mb-3">
              <label for="editCountry" class="form-label">Country</label>
              <input type="text" class="form-control" id="editCountry">
            </div>
            <div class="mb-3">
              <label for="editPostcode" class="form-label">Postcode</label>
              <input type="text" class="form-control" id="editPostcode">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveChangesBtn">Save Changes</button>
        </div>
      </div>
    </div>
  </div>
 
  <!-- Bootstrap & jQuery JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="random_user_app.js"></script>
</body>
</html>
