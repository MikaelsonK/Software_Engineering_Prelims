<!DOCTYPE html>
<html lang="en">
<head>
    <title>Random User Fetcher</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container bg-success text-center mt-3">
        <h1>Random User Fetcher</h1>
    </div>
    
    <div class="container d-flex justify-content-center mt-4">
        <form id="myForm">
            <input type="number" id="amount" name="amount" placeholder="1 to 1000">
            <input type="submit" value="Submit">
        </form>
    </div>

    <div class="container mt-4">
        <div class="row text-center fw-bold">
            <div class="col">
                <select id="name" name="name">
                <option value="fname">First Name</option>
                <option value="lname">Last Name</option>
            </select> 
            </div>
            <div class="col">Gender</div>
            <div class="col">Country</div>
            <div class="col">Email</div>
        </div>
        <div id="userResults"></div>
    </div>

    <div class="modal" id="myModal" tabindex="-1" aria-labelledby="title-modal" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header justify-content-center bg-success">
                    <img id="imgModal" src="" alt="User Image" class="img-fluid rounded-circle"> 
                </div>
                <div class="modal-body justify-content-center text-center">
                    <h3 id="nameModal" class="box"></h3>
                    <p class="box"><strong>Address: </strong> <span id="addressModal"></span></p>
                    <p class="box"><strong>Email: </strong> <span id="emailModal"></span></p>
                    <p class="box"><strong>Phone Number: </strong> <span id="phoneModal"></span></p>
                    <p class="box"><strong>Telephone Number: </strong> <span id="telephoneModal"></span></p>
                    <p class="box"><strong>Date of Birth: </strong> <span id="dobModal"></span></p>
                    <p class="box"><strong>Gender: </strong> <span id="genderModal"></span></p>
                </div>
                <div class="modal-footer bg-secondary">
                    <button type="button" style="margin-right: auto;" class="btn btn-dark" id="editButton">
                        Edit</button> 
                    <button type="button" style="margin-right: auto;" class="btn btn-dark" id="deleteButton">
                        Delete</button> 
                    <button type="button" class="btn btn-dark" data-bs-dismiss="modal" aria-label="Close">Close</button>
                </div>
            </div>
        </div>
    </div>
    <script src='fetchUsers.js'></script>
</body>
</html>
