<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Users Generator</title>
  <link rel="stylesheet" href="styles3.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" 
        rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5 text-center">
    <h2 class="mb-4"> Ilon's Random Users Generator</h2>
    
    <!-- Input above button -->
    <div class="d-flex flex-column align-items-center mb-3">
      <input type="number" id="userCount" min="0" max="1000" 
             placeholder="Enter number of random users">
      <button id="generateBtn" class="btn btn-primary mt-3">Generate</button>
    </div>
    
    <!-- Error -->
    <div id="error"></div>
    
    <!-- Table -->
    <div class="table-responsive">
      <table id="userTable" class="table table-hover"></table>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-secondary text-white rounded-4 p-4">
        
        <!-- VIEW MODE -->
        <div id="viewMode">
          <div class="text-center">
            <img id="modalPicture" src="" class="rounded-circle mb-3" width="100" height="100">
            <h5 id="modalName"></h5>
          </div>
          
          <div class="bg-light text-dark rounded-4 p-3 my-2">
            <strong>Address</strong>
            <p id="modalAddress" class="mb-0"></p>
          </div>
          
          <div class="bg-light text-dark rounded-4 p-3 my-2">
            <strong>Email</strong>
            <p id="modalEmail" class="mb-0"></p>
          </div>

          <div class="bg-light text-dark rounded-4 p-3 my-2">
            <strong>Phone</strong>
            <p id="modalPhone" class="mb-0"></p>
          </div>

          <div class="bg-light text-dark rounded-4 p-3 my-2">
            <strong>Date of Birth</strong>
            <p id="modalDob" class="mb-0"></p>
          </div>

          <!-- <div class="bg-light text-dark rounded-4 p-3 my-2">
            <strong>Gender</strong>
            <p id="modalGender" class="mb-0"></p>
          </div> -->

          <div class="d-flex justify-content-between mt-3">
            <button id="deleteUser" class="btn btn-danger">🗑️ Delete</button>
            <button id="editUser" class="btn btn-warning text-dark">✏️ Edit</button>
          </div>
        </div>

        <!-- EDIT MODE -->
        <div id="editMode" style="display:none;">
          <h5 class="text-center mb-3">Edit User</h5>
          <form id="editForm" class="text-dark">
            <div class="mb-2">
              <label class="form-label">First Name</label>
              <input type="text" id="editFirst" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">Last Name</label>
              <input type="text" id="editLast" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">Gender</label>
              <select id="editGender" class="form-control">
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Email</label>
              <input type="email" id="editEmail" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">Address</label>
              <input type="text" id="editAddress" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">Country</label>
              <input type="text" id="editCountry" class="form-control">
            </div>
            <div class="d-flex justify-content-between mt-3">
              <button type="button" id="cancelEdit" class="btn btn-secondary">Cancel</button>
              <button type="submit" class="btn btn-success">Save Changes</button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="script3.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
