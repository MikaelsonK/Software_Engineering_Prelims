<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random User Generator</title>

  <!-- Bootstrap CSS -->
   
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    .t {
  color: rgb(0, 0, 0);
  font-family: 'Arial';
}



    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 40px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: rgba(246, 253, 248, 0.77);
      padding: 20px;
      border-radius: 8px;
    }

    input, select, button {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
      width: 20%;
      box-sizing: border-box;
      background: rgba(30, 255, 195, 0.833);
      color: white;
      border: none;
      border-radius: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      border: 1px solid #dbdada;
    }

    th {
      background-color: #eee;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="title">Random User Generator</h2>

    <input type="number" id="userCount" placeholder="Enter number of random users" min="1" max="1000">
    
    <select id="nameType">
      <option value="first">First Name</option>
      <option value="last">Last Name</option>
    </select>

    <button onclick="generateUsers()">Generate</button>

    <table>
      <thead>
        <tr>
          <th id="nameHeader">First Name</th>
          <th>Gender</th>
          <th>Email Address</th>
          <th>Country</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
  </div>

  <!-- Bootstrap Modal -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="userModalLabel">User Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modalContent" style="text-align: center;">
          <!-- Dynamic user info will be injected here -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" id="deleteUserBtn">🗑️ Delete</button>
          <button type="button" class="btn btn-primary" id="editUserBtn">🖉 Edit</button>
        </div>
      </div>
    </div>
  </div>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!--  JS logic -->
  <script src="Prelim.js"></script>
</body>
</html>
