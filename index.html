<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random User Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center mb-4">
      <div class="col-md-6 d-flex justify-content-center">
        <input id="numBox" type="number" 
               class="form-control rounded-pill text-center shadow-sm me-2"
               placeholder="Enter number of random users (0-1000)" 
               min="0" max="1000">
        <button id="getUsers" class="btn rounded-pill shadow-sm">
          Generate Users
        </button>
      </div>
    </div>

    <div id="err" class="alert alert-danger d-none text-center"></div>

    <div class="row text-center header-row mb-2">
      <div class="col">
        <select id="nameOpt" class="form-select rounded-pill text-center">
          <option value="first">First Name</option>
          <option value="last">Last Name</option>
        </select>
      </div>
      <!--this is showing the gender email and country of the page-->
      <div class="col">Gender</div>
      <div class="col">Email</div>
      <div class="col">Country</div>
    </div>

    <div id="rowsBox"></div>
  </div>


  <div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalName"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <img id="modalPicture" src="" class="img-fluid rounded-circle mb-3" alt="User picture">
          <p id="modalAddress"></p>
          <p id="modalEmail"></p>
          <p id="modalPhone"></p>
          <p id="modalCell"></p>
          <p id="modalDob"></p>
          <p id="modalGender"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" id="deleteBtn">Delete</button>
          <button type="button" class="btn btn-primary" id="editBtn">Edit</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
