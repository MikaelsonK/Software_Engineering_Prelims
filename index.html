<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random User Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="container text-center mt-5">
    <h1 class="mb-4 text-primary fw-bold">Random User Generator</h1>
    <h2 class = "mb-4 text-primary fw-bold"> This Is My Prelim For SeTools</h2>

    <!-- Controls -->
    <div class="d-inline-block p-4 bg-white rounded shadow mb-4">
      <input type="number" id="userCount" placeholder="Enter number (1–1000)" min="1" max="1000" class="form-control d-inline-block w-auto me-2">
      <select id="nameOption" class="form-select d-inline-block w-auto me-2">
        <option value="first">First Name</option>
        <option value="last">Last Name</option>
      </select>
      <button id="generateButton" class="btn btn-primary">Generate</button>
    </div>

    <!-- Table -->
    <div class="table-responsive">
      <table class="table table-striped table-bordered table-hover align-middle">
        <thead class="table-primary text-center">
          <tr>
            <th>Name</th>
            <th>Gender</th>
            <th>Email</th>
            <th>Country</th>
          </tr>
        </thead>
        <tbody id="userTable" class="text-center">
          <tr><td colspan="4">No users yet</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- User Info Modal -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="userModalLabel">User Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body d-flex align-items-start gap-3">
          <img id="userImage" src="" alt="User Photo" class="user-photo" width="120">
          <div>
            <p><strong>Name:</strong> <span id="modalName"></span></p>
            <p><strong>Email:</strong> <span id="modalEmail"></span></p>
            <p><strong>Gender:</strong> <span id="modalGender"></span></p>
            <p><strong>DOB:</strong> <span id="modalDob"></span></p>
            <p><strong>Phone:</strong> <span id="modalPhone"></span></p>
            <p><strong>Address:</strong> <span id="modalAddress"></span></p>
          </div>
        </div>
        <div class="modal-footer">
          <button id="editUser" class="btn btn-warning"> Edit</button>
          <button id="deleteUser" class="btn btn-danger"> Delete</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Main Script -->
  <script src="script.js"></script>
</body>
</html>
