<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random User Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Random User Generator</h2>

    <div class="input-section">
      <input type="number" id="userCount" placeholder="Enter number of users (1–1000)" min="1" max="1000">
      <button id="fetchBtn">Generate Users</button>
    </div>

    <p id="errorMsg"></p>

    <table id="userTable">
      <thead>
        <tr>
          <th>
            <select id="nameType">
              <option value="first">First Name</option>
              <option value="last">Last Name</option>
            </select>
          </th>
          <th>Gender</th>
          <th>Email</th>
          <th>Country</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>

    
  </div>
  <div id="userModal" class="modal">
    <div class="modal-content">
      <span id="closeModal">&times;</span>
      <img id="modalImg" src="" alt="User Picture">
      
      <div class="modal-field">
        <label for = "modalName">Full Name</label>
        <input type="text" id="modalName">
      </div>

      <div class="modal-field">
        <label for="modalAddress">Address</label>
        <textarea id="modalAddress"></textarea>
      </div>

      <div class="modal-field">
        <label for="modalEmail">Email</label>
        <input type="email" id="modalEmail">
      </div>

      <div class="modal-field">
        <label for="modalPhone">Phone</label>
        <input type="text" id="modalPhone">
      </div>

      <div class="modal-field">
        <label for="modalDob">Date of Birth</label>
        <input type="date" id="modalDob">
      </div>

      <div class="modal-field">
        <label for = "modalGender">Gender</label>
        <select id="modalGender">
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
      <div class="modal-actions">
        <button id="saveUser">Save User</button>
        <button id="deleteUser">Delete</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
