<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">
<div class="p-4 bg-dark text-white text-center">
  <h2 class="mb-0">User Generator</h2>

  <div id="controls" class="row g-2 align-items-center mt-4">
    <div class="col-auto">
      <label for="count" class="form-label mb-0">Users:</label>
    </div>
    <div class="col-auto">
      <input id="count" type="number" class="form-control" min="0" max="1000" value="0" style="width:100px;">
    </div>
    <div class="col-auto">
      <select id="nameMode" class="form-select" style="width:140px;">
        <option value="first" selected>First name</option>
        <option value="last">Last name</option>
      </select>
    </div>
    <div class="col-auto">
      <button id="generate" class="btn btn-secondary" type="button">Generate</button>
    </div>
  </div>

  <div class="mt-4">
    <table class="table table-dark align-middle mb-0">
      <thead>
        <tr>
          <th>Name</th>
          <th>Gender</th>
          <th>Email</th>
          <th>Country</th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content border-0 rounded-4 shadow-lg">
      <div class="modal-header border-0">
        <h5 class="modal-title">User Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="card border-0 rounded-4 p-4 bg-light">
          <div class="d-flex flex-column align-items-center">
            <div id="userAvatar" class="rounded-circle bg-dark text-white d-flex align-items-center justify-content-center mb-3" style="width:80px; height:80px; font-size:28px;"></div>
            <h4 id="userName" class="fw-bold mb-2 px-3 py-1 bg-white rounded-pill"></h4>
            <div class="w-100 mt-3">
              <div class="mb-2 px-3 py-2 bg-white rounded-pill">
                <strong>Address:</strong> <span id="userAddress"></span>
              </div>
              <div class="mb-2 px-3 py-2 bg-white rounded-pill">
                <strong>Email:</strong> <span id="userEmail"></span>
              </div>
              <div class="mb-2 px-3 py-2 bg-white rounded-pill">
                <strong>Phone:</strong> <span id="userPhone"></span>
              </div>

              <div class="mb-2 px-3 py-2 bg-white rounded-pill">
                <strong>DOB:</strong> <span id="userDob"></span>
              </div>
              <div class="mb-2 px-3 py-2 bg-white rounded-pill">
                <strong>Gender:</strong> <span id="userGender"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer border-0">
        <button id="editUser" class="btn btn-warning">✏️ Edit</button>
        <button id="saveUser" class="btn btn-success d-none">💾 Save</button>
        <button id="deleteUser" class="btn btn-danger">🗑️ Delete</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="code.js"></script>
</body>
</html>
