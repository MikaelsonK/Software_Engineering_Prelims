<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random User Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="prelim.css"> 
    <script src="prelim.js"> </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <!-- First -->
  <div class="container">
    <header id="headerBox">
      <h1>Red's Random User Generator</h1>
    </header>
    
    <div class="error" id="errorMessage"></div>
    
    <div class="search-container">
      <input type="number" id="userCount" min="1" max="1000" placeholder="Enter from 1 to 1000 users">
      <button id="generateBtn">Generate Users</button>
    </div>

  <!-- Second -->
    <div class="table-container">
      <table id="usersTable">

        <thead>
          <tr>
              <th>
              <div class="name-header">
                Name
                <select id="nameFormat">
                  <option value="first">First</option>
                  <option value="last">Last</option>
                </select>
              </div>
              </th>
              <th>Gender</th>
              <th>Email Address</th>
              <th>Country</th>
          </tr>
        </thead>

        <tbody id="usersBody">
          <tr>
            <td colspan="4">
              <div class="loading">Loading users...</div>
            </td>
          </tr>
        </tbody>

      </table>
    </div>
  </div>

<!-- Third  -->
<div class="modal fade" id="userModal"> 
  <!-- this will not allow the modal to show -->
  <div class="modal-dialog modal-dialog-centered"> 
    <div class="modal-content">
      <!-- header, title, x -->
      <div class="modal-header">
        <h5 class="modal-title">User Info</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <!-- body of the entire -->
      <div class="modal-body" id="viewMode">
  
        
  <!-- Centered Image -->
  <div class="text-center mb-3">
    <img id="modalPicture" 
        class="img-fluid rounded-circle" 
        style="width:120px;height:120px;object-fit:cover;">
  </div>
 
  <!-- Information on modal (span is inline container) -->
    <div class="text-start mt-3">
        <h5 id="modalName"></h5>
        <p><strong>Address:</strong> <span id="modalAddress"></span></p>
        <p><strong>Email:</strong> <span id="modalEmail"></span></p>
        <p><strong>Telephone:</strong> <span id="modalPhone"></span></p>
        <p><strong>Cellphone:</strong> <span id="modalCell"></span></p>
        <p><strong>Date of Birth:</strong> <span id="modalDob"></span></p>
        <p><strong>Gender:</strong> <span id="modalGender"></span></p>
    </div>
    </div>

      <!-- Edit form (style makes it invisible until shown) -->
      <div class="modal-body" id="editMode" style="display:none;">
        <form id="editForm">
          <input type="text" id="editName" class="form-control mb-2">
          <input type="text" id="editAddress" class="form-control mb-2">
          <input type="email" id="editEmail" class="form-control mb-2">
          <input type="text" id="editPhone" class="form-control mb-2">
          <input type="text" id="editCell" class="form-control mb-2">
          <input type="date" id="editDob" class="form-control mb-2">
          
          <select id="editGender" class="form-control mb-2">
            <option value="Male">Male</option>
            <option value="Female">Female</option>    
          </select>

        </form>
      </div>

      <!-- Del, Edit, dnd Done -->
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" id="deleteUserBtn">Delete</button>
        <button type="button" class="btn btn-warning" id="editUserBtn">Edit</button>
        <button type="button" class="btn btn-success" id="saveUserBtn" style="display:none;"> Save</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Done</button>
      </div>
      
    </div>
  </div>
</div>

<!-- bg video  -->
  <div class="video-bg">
    <video autoplay muted loop>
      <source src="Social Media Network Animation -  4K Social Media Background Video Green Screen copy.mp4" type="video/mp4">
    </video>
  </div>

</body>
</html>
