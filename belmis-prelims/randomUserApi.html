<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random User Generator</title>
  <link rel="stylesheet" href="randomUserApi.css">
  <!-- Bootstrap 4 CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
  <div class="container text-center mt-4">
    <h2>Random User Generator</h2>

    <input type="number" id="userCount" placeholder="Enter number of users" min="1" max="50">
    <button id="generateBtn">Generate Users</button>

    <table id="userTable" class="table table-bordered table-hover mt-3">
      <thead class="thead-dark">
        <tr>
          <th>
            <select id="nameSelect">
              <option value="first">First Name</option>
              <option value="last">Last Name</option>
            </select>
          </th>
          <th>Gender</th>
          <th>Email</th>
          <th>Country</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
  </div>

  <!-- Bootstrap Modal -->
  <div class="modal fade" id="userModal" tabindex="-1" role="dialog" aria-labelledby="userModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content bg-light-purple">
        <div class="modal-header">
          <h5 class="modal-title" id="userModalLabel">User Details</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close" id="closeModal">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body text-center">
          <img id="modalPicture" src="" alt="User Picture" class="rounded-circle mb-3" width="100" height="100">
          <h3 id="modalName"></h3>
          <p id="modalAddress"></p>
          <p id="modalEmail"></p>

          <!-- Action buttons -->
          <div class="modal-actions mb-3">
            <button id="editUser" class="btn btn-info">✏️ Edit</button>
            <button id="deleteUser" class="btn btn-danger">🗑️ Delete</button>
          </div>

          <!-- Hidden edit form -->
          <div id="editForm" class="edit-form" style="display:none;">
            <input type="text" id="editName" class="form-control mb-2" placeholder="Full Name">
            <input type="text" id="editAddress" class="form-control mb-2" placeholder="Address">
            <input type="email" id="editEmail" class="form-control mb-2" placeholder="Email">
            <button id="saveEdit" class="btn btn-success">💾 Save</button>
            <button id="cancelEdit" class="btn btn-secondary">❌ Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS + jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="randomUserApi.js"></script>
</body>
</html>
